name: Offline logic tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # Links the production sources against test doubles and runs the monitoring,
      # dashboard, history and localization checks. This does not prove compatibility
      # with the real RimWorld assemblies; that requires the game installation.
      - run: dotnet run --project Tests/PowerGridManager.Tests.csproj --configuration Release
