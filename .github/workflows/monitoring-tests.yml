name: Offline logic tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # XML/key/source hygiene checks need no game assemblies or third-party packages.
      - run: python3 Tests/static_checks.py
      # Links the production sources against test doubles and runs the monitoring,
      # dashboard, history, diagnostics, forecast, management, compatibility and
      # localization checks. This does not prove binary compatibility with the real
      # RimWorld assemblies; that requires a game installation.
      - run: dotnet run --project Tests/PowerGridManager.Tests.csproj --configuration Release
      - run: python3 Tests/package_release_test.py
      # Verifies that clean release staging and zip packaging succeed without leaking dev files.
      - run: ./package-release.sh --allow-unbuilt && rm -rf dist
